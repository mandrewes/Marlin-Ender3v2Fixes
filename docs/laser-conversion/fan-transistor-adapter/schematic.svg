<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="680" viewBox="0 0 1140 680"><rect width="1140" height="680" fill="white"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="40" y="42" font-size="26" font-weight="bold" fill="#16364a" text-anchor="start">Creality V4.2.2 FAN (PA0) → 5 V TTL adapter (non-inverting)</text><text x="40" y="70" font-size="15" font-weight="normal" fill="#16364a" text-anchor="start">Fan ON (FAN− ≈ 0 V) → OUT ≈ 5 V  |  Fan OFF (FAN− ≈ 24 V) → OUT ≈ 0 V  |  laser disconnected for bench</text><rect x="40" y="100" width="280" height="320" rx="6" stroke="#ac5c00" stroke-width="3" fill="#fff8f0"/><text x="55" y="130" font-size="15" font-weight="bold" fill="#ac5c00" text-anchor="start">K-FAN1 or K-FAN2 (shared PA0)</text><text x="55" y="158" font-size="14" font-weight="normal" fill="#16364a" text-anchor="start">FAN+  (fixed ≈ 24 V)</text><text x="55" y="186" font-size="14" font-weight="normal" fill="#16364a" text-anchor="start">FAN−  (switched drain)</text><text x="55" y="220" font-size="14" font-weight="bold" fill="#0867a5" text-anchor="start">Board / PSU DC−  =  common GND</text><text x="55" y="255" font-size="14" font-weight="bold" fill="#16364a" text-anchor="start">Rload 2.2 kΩ 1 W</text><text x="55" y="278" font-size="13" font-weight="normal" fill="#16364a" text-anchor="start">across FAN+ → FAN−</text><text x="55" y="302" font-size="13" font-weight="normal" fill="#16364a" text-anchor="start">I≈10.9 mA  P≈0.26 W @ 24 V ON</text><text x="55" y="335" font-size="13" font-weight="normal" fill="#16364a" text-anchor="start">Optional Dfly (UF4007)</text><text x="55" y="355" font-size="12" font-weight="normal" fill="#16364a" text-anchor="start">cathode→FAN+ if fan remains</text><text x="55" y="390" font-size="12" font-weight="normal" fill="#b32727" text-anchor="start">Do NOT invent K-FAN pin order:</text><text x="55" y="408" font-size="12" font-weight="normal" fill="#b32727" text-anchor="start">verify +/− from silk / meter</text><rect x="360" y="100" width="340" height="320" rx="6" stroke="#35566b" stroke-width="3" fill="#f5f8fa"/><text x="375" y="130" font-size="16" font-weight="bold" fill="#16364a" text-anchor="start">Sense + invert (2N3904)</text><text x="375" y="160" font-size="13" font-weight="normal" fill="#16364a" text-anchor="start">FAN− ── R1 47 kΩ ──●── R2 10 kΩ ── GND</text><text x="375" y="185" font-size="13" font-weight="normal" fill="#16364a" text-anchor="start">                  │</text><text x="375" y="210" font-size="13" font-weight="normal" fill="#16364a" text-anchor="start">                  Rb 4.7 kΩ</text><text x="375" y="235" font-size="13" font-weight="normal" fill="#16364a" text-anchor="start">                  │</text><text x="375" y="260" font-size="13" font-weight="normal" fill="#16364a" text-anchor="start">                  B of Q1 (NPN)</text><text x="375" y="290" font-size="14" font-weight="bold" fill="#16364a" text-anchor="start">Q1: 2N3904 / BC547</text><text x="375" y="315" font-size="13" font-weight="normal" fill="#16364a" text-anchor="start">E → GND   C → OUT node</text><text x="375" y="345" font-size="13" font-weight="normal" fill="#16364a" text-anchor="start">When FAN−≈24 V: Q1 ON → OUT low</text><text x="375" y="368" font-size="13" font-weight="normal" fill="#16364a" text-anchor="start">When FAN−≈0 V:  Q1 OFF → OUT high</text><text x="375" y="400" font-size="13" font-weight="bold" fill="#0a7a3e" text-anchor="start">(= fan ON → laser ON; MCU-non-inv.)</text><rect x="740" y="100" width="360" height="320" rx="6" stroke="#0867a5" stroke-width="3" fill="#f5faff"/><text x="755" y="130" font-size="16" font-weight="bold" fill="#0867a5" text-anchor="start">5 V logic rail + output</text><text x="755" y="160" font-size="13" font-weight="bold" fill="#16364a" text-anchor="start">Preferred Vcc: external buck 24 V→5 V</text><text x="755" y="182" font-size="13" font-weight="normal" fill="#16364a" text-anchor="start">from PSU/FAN+ and DC− (common GND)</text><text x="755" y="210" font-size="12" font-weight="normal" fill="#16364a" text-anchor="start">Documented on-board 5 V also exists on</text><text x="755" y="228" font-size="12" font-weight="normal" fill="#16364a" text-anchor="start">BL_T / probe and Display EXP — both</text><text x="755" y="246" font-size="12" font-weight="normal" fill="#b32727" text-anchor="start">OCCUPIED; pin order NOT asserted here.</text><text x="755" y="280" font-size="14" font-weight="bold" fill="#16364a" text-anchor="start">Rc 1.0 kΩ: Vcc(5 V) → OUT / Q1-C</text><text x="755" y="305" font-size="14" font-weight="bold" fill="#16364a" text-anchor="start">Rpd 10 kΩ: OUT → GND (fail-safe LOW)</text><text x="755" y="330" font-size="13" font-weight="normal" fill="#16364a" text-anchor="start">Rs 220 Ω series to laser TTL (optional)</text><text x="755" y="355" font-size="13" font-weight="normal" fill="#16364a" text-anchor="start">Optional: Cbp 100 nF on Vcc–GND</text><text x="755" y="385" font-size="13" font-weight="bold" fill="#0a7a3e" text-anchor="start">3.3 V option: same parts, Vcc=3.3 V</text><text x="755" y="405" font-size="12" font-weight="normal" fill="#16364a" text-anchor="start">(Rc may stay 1 kΩ; levels ~0 / 3.3 V)</text><rect x="40" y="450" width="1060" height="130" rx="6" stroke="#b32727" stroke-width="2" fill="#fff4f1"/><text x="55" y="480" font-size="16" font-weight="bold" fill="#b32727" text-anchor="start">Safety / polarity</text><text x="55" y="505" font-size="13" font-weight="normal" fill="#16364a" text-anchor="start">Laser DISCONNECTED for resistor-load bench. Heaters DISCONNECTED. Scope ground ONLY on board/PSU DC− — never on FAN−.</text><text x="55" y="528" font-size="13" font-weight="normal" fill="#16364a" text-anchor="start">Unpowered board, missing 5 V, or fan OFF → OUT held LOW by Rpd (and/or Q1 ON when FAN− floats high via Rload).</text><text x="55" y="551" font-size="13" font-weight="normal" fill="#16364a" text-anchor="start">Common ground: 24 V DC−, adapter GND, 5 V buck GND, laser module GND. No M3 / laser fire without Michael watching.</text><text x="40" y="610" font-size="12" font-weight="normal" fill="#16364a" text-anchor="start">Why Rload: SCOPE8 saw ~1 kHz duty ripple stuck near 24 V — consistent with probing an always-hot node and/or an unloaded/inductive FAN− that never pulled cleanly.</text><text x="40" y="630" font-size="12" font-weight="normal" fill="#16364a" text-anchor="start">Rload from FAN+ to FAN− forces a defined pull-UP on the drain so OFF≈24 V and ON≈0 V at FAN− vs DC− (tests MOSFET path independent of fan electronics).</text><text x="40" y="655" font-size="11" font-weight="normal" fill="#666" text-anchor="start">Generated by generate_diagrams.py — values match README.md / BOM.csv</text></g></svg>