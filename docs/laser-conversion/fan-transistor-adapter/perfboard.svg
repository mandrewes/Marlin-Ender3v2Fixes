<svg xmlns="http://www.w3.org/2000/svg" width="780" height="600" viewBox="0 0 780 600"><rect width="780" height="600" fill="white"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="40" y="40" font-size="24" font-weight="bold" fill="#16364a" text-anchor="start">Perfboard wiring (suggested stripboard / proto layout)</text><text x="40" y="68" font-size="14" font-weight="normal" fill="#16364a" text-anchor="start">Top view · not to scale · verify every net with a meter before applying 24 V</text><rect x="40" y="100" width="700" height="420" rx="4" stroke="#888" stroke-width="2" fill="#fafafa"/><line x1="60" y1="120" x2="720" y2="120" stroke="#ddd" stroke-width="1"/><line x1="60" y1="146" x2="720" y2="146" stroke="#ddd" stroke-width="1"/><line x1="60" y1="172" x2="720" y2="172" stroke="#ddd" stroke-width="1"/><line x1="60" y1="198" x2="720" y2="198" stroke="#ddd" stroke-width="1"/><line x1="60" y1="224" x2="720" y2="224" stroke="#ddd" stroke-width="1"/><line x1="60" y1="250" x2="720" y2="250" stroke="#ddd" stroke-width="1"/><line x1="60" y1="276" x2="720" y2="276" stroke="#ddd" stroke-width="1"/><line x1="60" y1="302" x2="720" y2="302" stroke="#ddd" stroke-width="1"/><line x1="60" y1="328" x2="720" y2="328" stroke="#ddd" stroke-width="1"/><line x1="60" y1="354" x2="720" y2="354" stroke="#ddd" stroke-width="1"/><line x1="60" y1="380" x2="720" y2="380" stroke="#ddd" stroke-width="1"/><line x1="60" y1="406" x2="720" y2="406" stroke="#ddd" stroke-width="1"/><line x1="60" y1="432" x2="720" y2="432" stroke="#ddd" stroke-width="1"/><line x1="60" y1="458" x2="720" y2="458" stroke="#ddd" stroke-width="1"/><line x1="60" y1="484" x2="720" y2="484" stroke="#ddd" stroke-width="1"/><line x1="60" y1="120" x2="60" y2="500" stroke="#eee" stroke-width="1"/><line x1="86" y1="120" x2="86" y2="500" stroke="#eee" stroke-width="1"/><line x1="112" y1="120" x2="112" y2="500" stroke="#eee" stroke-width="1"/><line x1="138" y1="120" x2="138" y2="500" stroke="#eee" stroke-width="1"/><line x1="164" y1="120" x2="164" y2="500" stroke="#eee" stroke-width="1"/><line x1="190" y1="120" x2="190" y2="500" stroke="#eee" stroke-width="1"/><line x1="216" y1="120" x2="216" y2="500" stroke="#eee" stroke-width="1"/><line x1="242" y1="120" x2="242" y2="500" stroke="#eee" stroke-width="1"/><line x1="268" y1="120" x2="268" y2="500" stroke="#eee" stroke-width="1"/><line x1="294" y1="120" x2="294" y2="500" stroke="#eee" stroke-width="1"/><line x1="320" y1="120" x2="320" y2="500" stroke="#eee" stroke-width="1"/><line x1="346" y1="120" x2="346" y2="500" stroke="#eee" stroke-width="1"/><line x1="372" y1="120" x2="372" y2="500" stroke="#eee" stroke-width="1"/><line x1="398" y1="120" x2="398" y2="500" stroke="#eee" stroke-width="1"/><line x1="424" y1="120" x2="424" y2="500" stroke="#eee" stroke-width="1"/><line x1="450" y1="120" x2="450" y2="500" stroke="#eee" stroke-width="1"/><line x1="476" y1="120" x2="476" y2="500" stroke="#eee" stroke-width="1"/><line x1="502" y1="120" x2="502" y2="500" stroke="#eee" stroke-width="1"/><line x1="528" y1="120" x2="528" y2="500" stroke="#eee" stroke-width="1"/><line x1="554" y1="120" x2="554" y2="500" stroke="#eee" stroke-width="1"/><line x1="580" y1="120" x2="580" y2="500" stroke="#eee" stroke-width="1"/><line x1="606" y1="120" x2="606" y2="500" stroke="#eee" stroke-width="1"/><line x1="632" y1="120" x2="632" y2="500" stroke="#eee" stroke-width="1"/><line x1="658" y1="120" x2="658" y2="500" stroke="#eee" stroke-width="1"/><line x1="684" y1="120" x2="684" y2="500" stroke="#eee" stroke-width="1"/><line x1="710" y1="120" x2="710" y2="500" stroke="#eee" stroke-width="1"/><rect x="70" y="130" width="200" height="150" rx="8" stroke="#ac5c00" stroke-width="2" fill="#fff"/><text x="80" y="152" font-size="14" font-weight="bold" fill="#ac5c00" text-anchor="start">IN from K-FAN</text><text x="80" y="174" font-size="12" font-weight="normal" fill="#16364a" text-anchor="start">FAN+  → Rload left</text><text x="80" y="192" font-size="12" font-weight="normal" fill="#16364a" text-anchor="start">FAN−  → Rload right</text><text x="80" y="210" font-size="12" font-weight="normal" fill="#16364a" text-anchor="start">FAN−  → R1 (47k)</text><text x="80" y="228" font-size="12" font-weight="normal" fill="#16364a" text-anchor="start">GND   → common rail</text><rect x="300" y="130" width="200" height="150" rx="8" stroke="#35566b" stroke-width="2" fill="#fff"/><text x="310" y="152" font-size="14" font-weight="bold" fill="#35566b" text-anchor="start">Divider / Q1</text><text x="310" y="174" font-size="12" font-weight="normal" fill="#16364a" text-anchor="start">R1–R2 junction → Rb</text><text x="310" y="192" font-size="12" font-weight="normal" fill="#16364a" text-anchor="start">Rb → Q1 base</text><text x="310" y="210" font-size="12" font-weight="normal" fill="#16364a" text-anchor="start">Q1 E → GND rail</text><text x="310" y="228" font-size="12" font-weight="normal" fill="#16364a" text-anchor="start">Q1 C → OUT node</text><rect x="530" y="130" width="180" height="150" rx="8" stroke="#0867a5" stroke-width="2" fill="#fff"/><text x="540" y="152" font-size="14" font-weight="bold" fill="#0867a5" text-anchor="start">5 V / OUT</text><text x="540" y="174" font-size="12" font-weight="normal" fill="#16364a" text-anchor="start">Buck +5 → Vcc rail</text><text x="540" y="192" font-size="12" font-weight="normal" fill="#16364a" text-anchor="start">Rc: Vcc → OUT</text><text x="540" y="210" font-size="12" font-weight="normal" fill="#16364a" text-anchor="start">Rpd: OUT → GND</text><text x="540" y="228" font-size="12" font-weight="normal" fill="#16364a" text-anchor="start">OUT → Rs → laser TTL</text><rect x="70" y="320" width="300" height="140" rx="8" stroke="#16364a" stroke-width="2" fill="#fff"/><text x="80" y="342" font-size="14" font-weight="bold" fill="#16364a" text-anchor="start">Rails (recommended)</text><text x="80" y="364" font-size="12" font-weight="normal" fill="#16364a" text-anchor="start">Top copper strip: Vcc (+5 V)</text><text x="80" y="382" font-size="12" font-weight="normal" fill="#16364a" text-anchor="start">Bottom copper strip: GND</text><text x="80" y="400" font-size="12" font-weight="normal" fill="#16364a" text-anchor="start">Keep 24 V FAN+ on a short stub only</text><text x="80" y="418" font-size="12" font-weight="normal" fill="#16364a" text-anchor="start">Keep Rload away from signal resistors (heat)</text><rect x="400" y="320" width="310" height="140" rx="8" stroke="#0a7a3e" stroke-width="2" fill="#fff"/><text x="410" y="342" font-size="14" font-weight="bold" fill="#0a7a3e" text-anchor="start">Optional</text><text x="410" y="364" font-size="12" font-weight="normal" fill="#16364a" text-anchor="start">Dfly across FAN+/FAN− if fan stays fitted</text><text x="410" y="382" font-size="12" font-weight="normal" fill="#16364a" text-anchor="start">100 nF Vcc–GND near Q1</text><text x="410" y="400" font-size="12" font-weight="normal" fill="#16364a" text-anchor="start">3.3 V: feed Vcc from 3.3 V instead of 5 V</text><text x="410" y="418" font-size="12" font-weight="normal" fill="#16364a" text-anchor="start">Second CE stage NOT required for polarity</text><text x="40" y="550" font-size="13" font-weight="normal" fill="#16364a" text-anchor="start">Wire colours (suggestion only): orange=FAN+, brown=FAN−, blue=GND, red=+5, green=OUT.</text><text x="40" y="575" font-size="13" font-weight="normal" fill="#b32727" text-anchor="start">K-FAN and BL_T/EXP contact order is NOT drawn — identify on the physical board.</text></g></svg>